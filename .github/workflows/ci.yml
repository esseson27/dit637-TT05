name: TT05 CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: backend-expressjs
        run: npm ci

      - name: Run backend tests
        working-directory: backend-expressjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: build_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend .env
        run: |
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > backend-expressjs/.env

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Copy backend to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_PUBLIC_DNS }} "rm -rf ~/backend-expressjs"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -r backend-expressjs ubuntu@${{ secrets.EC2_PUBLIC_DNS }}:~/

      - name: Start backend on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ubuntu@${{ secrets.EC2_PUBLIC_DNS }} << 'EOF'
            cd ~/backend-expressjs
            sudo apt-get update
            sudo apt-get install -y nodejs npm
            npm install
            pkill -f "node server.js" || true
            nohup npm start > app.log 2>&1 &
          EOF
