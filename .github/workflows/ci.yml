name: TT05 CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: backend-expressjs
        run: npm ci

      - name: Run backend tests
        working-directory: backend-expressjs
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm test


  deploy:
    name: Push to EC2 Instance
    runs-on: ubuntu-latest
    needs: build_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend .env
        run: |
          echo "MONGODB_URI=${{ secrets.MONGODB_URI }}" > backend-expressjs/.env

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Copy backend to EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/deploy_key \
          ubuntu@${{ secrets.EC2_PUBLIC_DNS }} \
          "rm -rf ~/backend-expressjs"

          scp -o StrictHostKeyChecking=no \
          -i ~/.ssh/deploy_key \
          -r backend-expressjs \
          ubuntu@${{ secrets.EC2_PUBLIC_DNS }}:~/

      - name: Start backend and ngrok on EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/deploy_key \
          ubuntu@${{ secrets.EC2_PUBLIC_DNS }} << EOF

            cd ~/backend-expressjs

            sudo apt-get update
            sudo apt-get install -y nodejs npm curl unzip

            npm install

            pkill -f "node server.js" || true
            pkill -f "ngrok" || true

            nohup npm start > app.log 2>&1 &

            sleep 10

            curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
              | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

            echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
              | sudo tee /etc/apt/sources.list.d/ngrok.list

            sudo apt-get update
            sudo apt-get install -y ngrok

            ngrok config add-authtoken "${{ secrets.NGROK_AUTH_TOKEN }}"

            nohup ngrok http 3000 \
              --log=stdout > ~/ngrok.log 2>&1 &

            sleep 10
          EOF

      - name: Print Ngrok Public URL
        run: |
          NGROK_URL=$(ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/deploy_key \
          ubuntu@${{ secrets.EC2_PUBLIC_DNS }} \
          "curl -s http://localhost:4040/api/tunnels | \
          grep -o 'https://[^\" ]*ngrok[^\" ]*' | head -1")

          echo "NGROK PUBLIC URL:"
          echo "$NGROK_URL"

          echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV


  zap_scan:
    name: Scan ZAP Website
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Get Ngrok URL
        run: |
          NGROK_URL=$(ssh -o StrictHostKeyChecking=no \
          -i ~/.ssh/deploy_key \
          ubuntu@${{ secrets.EC2_PUBLIC_DNS }} \
          "curl -s http://localhost:4040/api/tunnels | \
          grep -o 'https://[^\" ]*ngrok[^\" ]*' | head -1")

          echo "TARGET_URL=$NGROK_URL" >> $GITHUB_ENV

      - name: Scan ZAP website
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: '${{ env.TARGET_URL }}'
          fail_action: false
